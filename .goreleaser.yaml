# Release config for GoReleaser: cross-compiles, publishes a GitHub Release,
# and updates the Homebrew formula in olaysco/homebrew-tap so
# `brew install olaysco/tap/itan` gets the new version.
#
# Verify before tagging:
#   goreleaser check                 # config is valid for your goreleaser version
#   goreleaser release --snapshot --clean   # full dry run, publishes nothing
#
# Then:
#   git tag -a v0.3.0 -m "v0.3.0" && git push origin v0.3.0
version: 2

project_name: itan

before:
  hooks:
    - go mod tidy

builds:
  - id: itan
    main: ./cmd/itan
    binary: itan
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    # -s -w drops the symbol table and DWARF: the binary goes from ~15M to
    # ~11M, which matters for something people download.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: itan
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# GoReleaser deprecated `brews` in v2.10 and hard-deprecated it in v2.16:
# formulae that install pre-compiled binaries were always a workaround, and
# Homebrew wants casks for that now. Casks are the replacement, not a
# downgrade — `brew install olaysco/tap/itan` is unchanged.
homebrew_casks:
  - name: itan
    ids: [itan]
    repository:
      owner: olaysco
      name: homebrew-tap
      # A token with contents:write on the tap repo. GITHUB_TOKEN from the
      # release workflow only covers this repo, so the tap needs its own.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # `directory` is omitted deliberately: casks MUST live in Casks/, which
    # is the default, and goreleaser rejects anything else.
    homepage: https://github.com/olaysco/itan
    description: Agentic AI video editor — plain-language editing over ffmpeg and a real browser
    commit_author:
      name: Olayiwola Odunsi
      email: olayiwolaodunsi@gmail.com

    binaries: [itan]

    # Lets `brew audit` reconcile the homepage with the download domain.
    url:
      verified: github.com/olaysco/itan

    # The dependency that actually matters. Every render goes through ffmpeg,
    # and having brew install it is most of the reason to ship a tap at all.
    dependencies:
      - formula: ffmpeg

    # The binary is not code-signed or notarized, so macOS quarantines it on
    # download and the first run fails with a Gatekeeper error that says
    # nothing useful. Strip the attribute at install time.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/itan"]
          end

    # A browser cannot be a dependency (Chrome is itself a cask, and most
    # machines already have one), so say it plainly rather than letting
    # compose fail later with nothing to explain it.
    caveats: |
      itan needs a Chromium-family browser for `compose` — Chrome, Chromium,
      Edge, or Brave. Most machines already have one; if not:

        brew install --cask google-chrome

      Then check everything at once:

        itan doctor

      It reports ffmpeg, your model and API key, the browser, whether the
      model can see frames, and the optional voice and stock-media services.

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```
    brew install olaysco/tap/itan
    ```

    Or download a binary below. itan also needs `ffmpeg` and a Chromium-family
    browser; run `itan doctor` after installing and it will tell you what is
    missing.
